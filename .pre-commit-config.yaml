repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
  - repo: local
    hooks:
      - id: project-checks
        name: Format, lint, types, tests, and build
        entry: make checkall
        language: system
        pass_filenames: false
        files: ^(src/|tests/|public/|index\.html$|Makefile$|package\.json$|bun\.lock$|biome\.json$|tsconfig\.json$|vite\.config\.ts$)
