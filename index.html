<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9f4f7" />
    <script>
      (() => {
        const key = "par-arrows:settings:v1";
        let preference = "system";
        try {
          const raw = localStorage.getItem(key);
          const theme = raw ? JSON.parse(raw).theme : undefined;
          if (theme === "light" || theme === "dark" || theme === "system") {
            preference = theme;
          }
        } catch {}
        const dark =
          preference === "dark" ||
          (preference === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        const theme = dark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.content = dark ? "#101820" : "#e9f4f7";
      })();
    </script>
    <meta name="description" content="A spatial arrow puzzle. Rotate the cube, find a clear path, and let the arrows fly." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Par Arrows</title>
    <!-- Google tag (gtag.js). Dev servers and browser-test runs stay out of the reports. -->
    <script>
      (() => {
        const id = "G-2QKCC5SXD9";
        const local = ["localhost", "127.0.0.1", "[::1]", ""].includes(location.hostname);
        if (local || new URLSearchParams(location.search).has("test")) return;
        window.dataLayer = window.dataLayer || [];
        window.gtag = function gtag() {
          window.dataLayer.push(arguments);
        };
        window.gtag("js", new Date());
        window.gtag("config", id);
        const tag = document.createElement("script");
        tag.async = true;
        tag.src = `https://www.googletagmanager.com/gtag/js?id=${id}`;
        document.head.append(tag);
      })();
    </script>
  </head>
  <body>
    <noscript>Par Arrows needs JavaScript enabled to display the 3D puzzle.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
